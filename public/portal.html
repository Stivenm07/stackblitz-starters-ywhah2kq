<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Portal · MediGestión EPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2306b6d4'/><path d='M40 20h20v20h20v20H60v20H40V60H20V40h20z' fill='white'/></svg>">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></div>
      <div>MediGestión <small>EPS</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-card">
      🚑 Línea de urgencias
      <strong>123</strong>
      Orientación médica 24/7: <b>601 555 0123</b>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <div class="crumb">Portal del afiliado <b id="crumb">Inicio</b></div>
      <div class="topbar-actions">
        <div style="position:relative">
          <button class="icon-btn" id="bell" aria-label="Notificaciones">🔔<span class="dot"></span></button>
          <div class="dropdown hidden" id="notifs"></div>
        </div>
        <div class="user-chip">
          <div class="avatar" id="avatar">··</div>
          <div class="meta"><b id="userName">Cargando…</b><span id="userDoc"></span></div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout">Salir</button>
      </div>
    </header>

    <main class="content" id="view">
      <div class="loader"><div class="pulse">✚</div>Cargando tu información…</div>
    </main>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>

<script src="/js/portal.js"></script>
</body>
</html>
